<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<style>
* { box-sizing: border-box; }
html,body{margin:0;padding:0;background:#000;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;}
input,select,button{font-family:'IBM Plex Mono',monospace;}
a{color:#4C8DFF;text-decoration:none;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#08080A;}
::-webkit-scrollbar-thumb{background:#2E2E38;border-radius:6px;border:2px solid #08080A;}
.mono{font-family:'IBM Plex Mono',monospace;}
.header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #212129;background:linear-gradient(180deg,#0D0F15,#0A0B0F);position:sticky;top:0;z-index:20;}
.badge{width:34px;height:34px;border-radius:7px;background:#4C8DFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 0 18px rgba(76,141,255,.55);flex:0 0 auto;}
.tabbar,.fmtbar{display:flex;gap:3px;background:#08080A;border:1px solid #212129;border-radius:9px;padding:3px;}
.tabbtn{background:transparent;color:#5C6275;border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:6px;white-space:nowrap;}
.tabbtn.active{background:#17171D;color:#fff;}
.fmtbtn{background:transparent;color:#5C6275;border:none;cursor:pointer;font-size:12px;font-weight:700;padding:7px 14px;border-radius:6px;font-family:'IBM Plex Mono',monospace;}
.fmtbtn.active{background:rgba(76,141,255,.14);color:#4C8DFF;box-shadow:inset 0 0 0 1px #2A56B0;}
.posbtn{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:7px;background:#0F0F13;color:#A9AFC0;border:1px solid #212129;}
.posbtn.active{background:rgba(62,123,250,.12);color:#4C8DFF;border-color:#4C8DFF;}
.searchbox{background:#08080A;border:1px solid #212129;border-radius:7px;color:#fff;font-size:11.5px;padding:6px 10px;width:170px;}
.card{background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:hidden;}
.rowhead{display:grid;grid-template-columns:40px minmax(0,1fr) 40px 36px 44px 40px 84px 78px 96px;gap:6px;padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;color:#5C6275;border-bottom:1px solid #212129;background:#08080A;}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 40px 36px 44px 40px 84px 78px 96px;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid #212129;cursor:pointer;}
.row:hover{background:#17171D;}
.starbtn{width:20px;height:20px;padding:0;border-radius:5px;cursor:pointer;font-size:12px;line-height:1;background:transparent;border:1px solid #212129;color:#454A5C;flex:0 0 auto;}
.starbtn.on{background:rgba(255,201,60,.16);border-color:rgba(255,201,60,.5);color:#FFC93C;}
.content{padding:18px 22px 60px;max-width:1180px;margin:0 auto;}
.sidewrap{display:grid;grid-template-columns:minmax(700px,1fr) 360px;gap:18px;padding:18px 22px 60px;max-width:1560px;margin:0 auto;align-items:start;}
.sidecard{background:#0F0F13;border:1px solid #212129;border-radius:12px;padding:15px 16px;}
.slotrow{display:grid;grid-template-columns:52px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid #212129;}
.btn{background:#0F0F13;border:1px solid #212129;color:#A9AFC0;font-size:10.5px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.cfginput{width:64px;background:#17171D;border:1px solid #2E2E38;border-radius:6px;color:#fff;font-size:12px;padding:6px 8px;}
.suggcard{background:#0F0F13;border:1px solid #212129;border-left:3px solid #4C8DFF;border-radius:9px;padding:11px 13px;cursor:pointer;margin-bottom:9px;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:#17171D;border:1px solid #2E2E38;}
</style>
</head>

function esc(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function rankKey(){ return state.fmt==='ppr' ? 'rankPpr' : 'rankHalf'; }

function orderedPlayers(){ return PLAYERS.filter(p=>p[rankKey()]!=null).sort((a,b)=>a[rankKey()]-b[rankKey()]); }

function cfg(){ return state.cfg||{}; }

function rounds(){ return cfg().rounds ?? 17; }

function starters(){ return slotsStr().split(',').map(s=>s.trim()).filter(Boolean); }

function teamForPick(n){ const T=teams(), r=Math.floor(n/T), i=n%T; return r%2===0 ? i+1 : T-i; }
function pickLabelFor(n){ const T=teams(); return (Math.floor(n/T)+1)+'.'+String(n%T+1).padStart(2,'0'); }
function nextMyPick(from){ for(let n=from;n<teams()*rounds();n++){ if(teamForPick(n)===state.mySlot) return n; } return null; }

function draft(id){
  const n = state.picks.length;
  if(n>=teams()*rounds()) return;
  if(state.picks.find(p=>p.id===id)) return;
  state.picks.push({id, team:teamForPick(n), n});
  save();
}
function toggleQueue(id){ state.queue = state.queue.includes(id) ? state.queue.filter(x=>x!==id) : [...state.queue, id]; save(); }
function moveQueue(id,dir){
  const q=[...state.queue]; const i=q.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=q.length) return;
  [q[i],q[j]]=[q[j],q[i]]; state.queue=q; save();
}

function myRoster(){
  const byId=Object.fromEntries(PLAYERS.map(p=>[p.id,p]));
  return state.picks.filter(k=>k.team===state.mySlot).map(k=>byId[k.id]).filter(Boolean);
}
function needMap(){
  const roster=myRoster(); const counts={};
  roster.forEach(p=>{counts[p.pos]=(counts[p.pos]||0)+1;});
  const cap={}; starters().forEach(s=>{cap[s]=(cap[s]||0)+1;});
  const need={};
  ['QB','RB','WR','TE'].forEach(pos=>{ need[pos]=(counts[pos]||0) < (cap[pos]||0) ? 1 : 0; });
  const flexCap=cap['FLEX']||0;
  const flexHave=Math.max(0,(counts.RB||0)-(cap.RB||0))+Math.max(0,(counts.WR||0)-(cap.WR||0))+Math.max(0,(counts.TE||0)-(cap.TE||0));
  need.FLEX = flexHave<flexCap?1:0;
  need.K=(counts.K||0)<(cap.K||0)?1:0;
  need.DST=(counts.DST||0)<(cap.DEF||0)?1:0;
  return need;
}
function mkt(p){
  const c=p[mktCKey()], s=p[mktSKey()];
  const vals=[c,s].filter(v=>typeof v==='number');
  if(!vals.length) return null;
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return {avg:Math.round(avg), delta:Math.round(avg-p[rankKey()]), c, s};
}
function injPenalty(p){
  const a=p.injAction||'';
  if(a.startsWith('DO NOT DRAFT')) return -70;
  if(a.startsWith('MAJOR DOWNGRADE')) return -26;
  if(a.startsWith('High risk')) return -20;
  if(a.startsWith('Downgrade')) return -11;
  if(a.startsWith('Monitor closely')) return -7;
  if(a.startsWith('Monitor')) return -3;
  return 0;
}
function statusColor(p){
  const s=p.injStatus||'';
  if(s==='IR'||s==='Out') return '#FF3355';
  if(s==='Doubtful') return '#FF7B4C';

}

}

}

function scored(available, round, nextMineOverall){
  const need=needMap();
  const byTierPos={};
  available.forEach(p=>{ const k=p.pos+'|'+p[tierKey()]; byTierPos[k]=(byTierPos[k]||0)+1; });
  return available.map(p=>{
    const reasons=[]; let score=100*Math.pow(0.9655, Math.max(0,p[rankKey()]-1));
    if(nextMineOverall!=null && p[rankKey()]<=nextMineOverall){
      const b=Math.min(10,(nextMineOverall-p[rankKey()])*0.35);
      if(b>=3){ score+=b; reasons.push({text:'GONE BY '+pickLabelFor(nextMineOverall-1),color:'#4C8DFF'}); }
    }
    if(need[p.pos]){ score+=14; reasons.push({text:'FILLS '+p.pos,color:'#00FF9C'}); }
    else if(need.FLEX && (p.pos==='RB'||p.pos==='WR'||p.pos==='TE')){ score+=7; reasons.push({text:'FLEX',color:'#4C8DFF'}); }
    else if(p.pos!=='K'&&p.pos!=='DST'){ score+=2; reasons.push({text:p.pos+' DEPTH',color:'#8890A2'}); }
    const left = byTierPos[p.pos+'|'+p[tierKey()]]||0;
    if(left<=3 && p.pos!=='K' && p.pos!=='DST'){ score+=8; reasons.push({text:'LAST '+left+' IN TIER',color:'#FFC93C'}); }
    if(p.pos==='K'||p.pos==='DST'){
      if(round<rounds()-2){ score-=45; reasons.push({text:'TOO EARLY',color:'#FF3355'}); }
      else{ score+=26; reasons.push({text:'ROSTER FILL',color:'#00FF9C'}); }
    }
    const ip=injPenalty(p);
    if(ip<0){ score+=ip; reasons.push({text:(p.injAction||'').split('—')[0].trim().toUpperCase(),color:ip<=-20?'#FF3355':'#FFC93C'}); }
    const s=state.sos[p.team];
    if(s){ const b=(3-s)*4; score+=b; reasons.push({text:'SOS '+s,color:b>0?'#00FF9C':b<0?'#FF3355':'#8890A2'}); }
    const a=mkt(p);
    if(a && a.delta<=-15) reasons.push({text:'MKT '+a.avg+' ('+a.delta+' MARKET HIGHER)',color:a.delta<=-30?'#FF3355':'#FFC93C'});
    else if(a && a.delta>=10) reasons.push({text:'MKT '+a.avg+' (+'+a.delta+' WE LIKE HIM MORE)',color:'#00FF9C'});
    const byes={}; myRoster().forEach(r=>{ if(r.bye) byes[r.bye]=(byes[r.bye]||0)+1; });
    if(p.bye && (byes[p.bye]||0)>=3){ score-=7; reasons.push({text:'BYE '+p.bye+' STACK',color:'#FF7B4C'}); }
    return {p,score,reasons};
  }).sort((a,b)=>b.score-a.score);
}

      <div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-weight:700;font-size:16px">DRAFT ROOM</span>
          <span class="mono" style="font-size:11px;font-weight:700;color:#4C8DFF;border:1px solid #2A56B0;border-radius:5px;padding:2px 7px">1QB · ${esc(fmts.find(f=>f[0]===state.fmt)[1])}</span>
        </div>
        <div class="mono" style="font-size:10px;letter-spacing:.14em;color:#5C6275;margin-top:1px">${teams()}-TEAM SNAKE · ${rounds()} ROUNDS · TOP 200 + AUCTION $</div>
      </div>
    </div>
    <div class="fmtbar">${fmts.map(([k,label])=>`<button class="fmtbtn ${state.fmt===k?'active':''}" onclick="state.fmt='${k}';save()">${label}</button>`).join('')}</div>
    <div class="tabbar">
      <button class="tabbtn ${state.view==='board'?'active':''}" onclick="state.view='board';save()">Big Board</button>
      <button class="tabbtn ${state.view==='queue'?'active':''}" onclick="state.view='queue';save()">Queue (${state.queue.length})</button>
      <button class="tabbtn ${state.view==='grid'?'active':''}" onclick="state.view='grid';save()">Draft Grid</button>
      <button class="tabbtn ${state.view==='inj'?'active':''}" onclick="state.view='inj';save()">Injury Watch</button>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:8px;padding:5px 11px;background:#08080A;border:1px solid #212129;border-radius:8px">
      <span class="mono" style="font-size:10.5px;color:#5C6275">MY SLOT</span>
      <select onchange="state.mySlot=parseInt(this.value,10);save()" style="background:#17171D;color:#fff;border:1px solid #2E2E38;border-radius:6px;font-size:11.5px;padding:3px 6px">
        ${Array.from({length:teams()},(_,i)=>`<option value="${i+1}" ${state.mySlot===i+1?'selected':''}>#${i+1}</option>`).join('')}
      </select>
    </div>
    <button class="btn" onclick="state.showCfg=!state.showCfg;save()">${state.showCfg?'▾ ':'⚙ '}LEAGUE</button>
    <button class="btn" onclick="state.picks=state.picks.slice(0,-1);save()">UNDO</button>
    <button class="btn" onclick="if(confirm('Reset all picks?')){state.picks=[];save()}">RESET</button>
  </div>
  ${state.showCfg ? renderCfgPanel() : ''}
  `;
}

function renderCfgPanel(){
  return `<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #212129;background:#08080A">
    <label style="display:flex;flex-direction:column;gap:5px">
      <span class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275">TEAMS</span>
      <input class="cfginput" value="${teams()}" onchange="const v=parseInt(this.value,10);if(v>=4&&v<=20){state.cfg={...cfg(),teams:v};save();}">
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275">ROUNDS</span>
      <input class="cfginput" value="${rounds()}" onchange="const v=parseInt(this.value,10);if(v>=1&&v<=30){state.cfg={...cfg(),rounds:v};save();}">
    </label>
    <label style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:280px">
      <span class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275">STARTING SLOTS — COMMA LIST, USE FLEX AND DEF</span>
      <input style="width:100%;background:#17171D;border:1px solid #2E2E38;border-radius:6px;color:#fff;font-size:12px;padding:6px 8px" value="${esc(slotsStr())}" onchange="state.cfg={...cfg(),starterSlots:this.value};save()">
    </label>
    <label style="display:flex;flex-direction:column;gap:5px">
      <span class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275">SUGGESTIONS</span>

}

function renderBoard(){
  const taken=new Set(state.picks.map(p=>p.id));
  const teamOf={}; state.picks.forEach(k=>{teamOf[k.id]=k.team;});
  const pickN=state.picks.length;
  const onClockTeam=teamForPick(pickN);
  const mine=onClockTeam===state.mySlot;
  const round=Math.floor(pickN/teams());
  const available=orderedPlayers().filter(p=>!taken.has(p.id));

  const q=state.q.trim().toLowerCase();
  let list=orderedPlayers().filter(p=>{
    if(state.hideDrafted && taken.has(p.id)) return false;
    if(state.pos!=='ALL' && p.pos!==state.pos) return false;
    if(q && !(p.name.toLowerCase().includes(q) || (p.team||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const posBtns=['ALL','QB','RB','WR','TE','K','DST'].map(p=>`<button class="posbtn ${state.pos===p?'active':''}" onclick="state.pos='${p}';save()">${p}</button>`).join('');

  const myByes={}; myRoster().forEach(r=>{ if(r.bye) myByes[r.bye]=(myByes[r.bye]||0)+1; });

  const rows=list.map(p=>{
    const drafted=taken.has(p.id);
    const starred=state.queue.includes(p.id);
    const auc=p[auctionKey()];
    const a=mkt(p);
    const deltaColor = a ? (a.delta<=-30?'#FF3355':a.delta<=-15?'#FFC93C':a.delta>=10?'#00FF9C':'#8890A2') : '#454A5C';
    const deltaTxt = a ? (a.delta>0?'+'+a.delta:String(a.delta)) : '—';
    const rawDetail = a ? [a.c?('C'+Math.round(a.c)):null, a.s?('S'+Math.round(a.s)):null].filter(Boolean).join(' ') : 'no match';
    const detail = a ? (a.delta>=3&&a.delta<10?'◆ slight edge':(a.delta<=-3&&a.delta>-10?'⚠ slight reach':rawDetail)) : 'no match';
    const detailColor = a ? (a.delta>=3&&a.delta<10?'#00B36E':(a.delta<=-3&&a.delta>-10?'#FFC93C':'#454A5C')) : '#454A5C';
    const rankBadgeColor = a ? (a.delta>=3?'#00FF9C':a.delta<=-10?'#FF3355':a.delta<=-3?'#FFC93C':'#8890A2') : '#8890A2';
    const srcMap = p[mktSourcesKey()] || {};
    const srcEntries = Object.keys(srcMap);
    const sourcesLine = srcEntries.length
      ? srcEntries.map(src=>`<span style="margin-right:6px">${sourceAbbr(src)} <b style="color:#D8DBE6">${srcMap[src]}</b></span>`).join('')
      : `<span style="color:#454A5C">no source data</span>`;
    const cur=pickN+1;
    const slide = a && !drafted ? cur-a.avg : null;
    const hot = slide!=null && slide>=5;
    const liveTxt = drafted ? '—' : (slide==null?'—':(slide>0?'▼ '+slide:'in '+(-slide)+' picks away'));
    const sosVal = state.sos[p.team];
    const onClick = drafted ? '' : `draft('${p.id}')`;
    return `<div class="row" style="grid-template-columns:${rowGridCols()};opacity:${drafted?0.34:1}" onclick="${onClick}">
      <div class="mono" style="font-size:11px;color:#5C6275">${p[rankKey()]}</div>
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button class="starbtn ${starred?'on':''}" onclick="event.stopPropagation();toggleQueue('${p.id}')">${starred?'★':'☆'}</button>
        <span style="width:3px;height:26px;border-radius:2px;flex:0 0 auto;background:${TEAM_COLOR[p.team]||'#4C8DFF'}"></span>
        <div style="min-width:0">
          <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
          <div class="mono" style="font-size:10px;color:#5C6275;margin-top:1px">${drafted?('TEAM '+teamOf[p.id]+' · '+esc(p[tierKey()]||'')) : (esc(p.team)+' · '+esc(p[tierKey()]||''))}</div>
        </div>
      </div>
      <div class="mono" style="font-size:11px;font-weight:700;color:${POS_COLOR[p.pos]||'#A9AFC0'}">${esc(p[posRankKey()]||p.pos)}</div>
      <div class="mono" style="font-size:11.5px;text-align:center;color:${(myByes[p.bye]||0)>=2?'#FF7B4C':'#D8DBE6'}">${p.bye||'—'}</div>
      <div class="mono" style="font-size:11px;text-align:right;color:#8890A2">${auc!=null?'$'+auc:'—'}</div>
      <div class="mono" style="font-size:11px;text-align:center;color:${sosVal?(sosVal<=2?'#00FF9C':sosVal>=4?'#FF3355':'#A9AFC0'):'#454A5C'}">${sosVal||'—'}</div>
      <div style="text-align:right">
        ${state.showSources
          ? `<div class="mono" style="font-size:9.5px;line-height:1.5;color:#8890A2;text-align:left">${sourcesLine}</div><div class="mono" style="font-size:9.5px;font-weight:800;color:${rankBadgeColor};background:${rankBadgeColor}26;border:1px solid ${rankBadgeColor}73;border-radius:5px;padding:2px 6px;display:inline-block;margin-top:2px">OUR RANK ${p[rankKey()]}</div>`
          : `<div class="mono" style="display:inline-block;font-size:12px;font-weight:700;color:${deltaColor}">${deltaTxt}</div><div class="mono" style="font-size:9px;margin-top:1px;color:${detailColor}">${detail}</div>`
        }
      </div>
      <div class="mono" style="font-size:10.5px;text-align:right;color:${hot?'#FF5FC8':'#5C6275'}">${liveTxt}</div>
      <div class="mono" style="font-size:10px;line-height:1.3;color:${statusColor(p)};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${statusText(p)}</div>
    </div>`;
  }).join('');

  const roster=myRoster();
  const pool=[...roster]; const slotRows=[];
  const take=(test)=>{ const i=pool.findIndex(test); return i>=0?pool.splice(i,1)[0]:null; };
  starters().forEach(sl=>{
    let p=null;
    if(sl==='FLEX') p=take(x=>x.pos==='RB'||x.pos==='WR'||x.pos==='TE');
    else if(sl==='DEF') p=take(x=>x.pos==='DST');
    else p=take(x=>x.pos===sl);
    slotRows.push(`<div class="slotrow"><div class="mono" style="font-size:10px;font-weight:700;color:${p?'#A9AFC0':'#454A5C'}">${sl}</div><div style="font-size:12.5px;color:${p?'#fff':'#454A5C'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p?esc(p.name)+' · '+esc(p.team):'—'}</div><div class="mono" style="font-size:10.5px;text-align:right;color:#8890A2">${p&&p.bye?p.bye:''}</div></div>`);
  });
  pool.forEach(p=>slotRows.push(`<div class="slotrow"><div class="mono" style="font-size:10px;font-weight:700;color:#454A5C">BN</div><div style="font-size:12.5px;color:#A9AFC0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)} · ${esc(p.team)}</div><div class="mono" style="font-size:10.5px;text-align:right;color:#8890A2">${p.bye||''}</div></div>`));

  const byeLine = Object.keys(myByes).length ? ('BYE LOAD  '+Object.keys(myByes).sort((a,b)=>a-b).map(w=>'W'+w+':'+myByes[w]).join('   ')) : 'BYE LOAD  —';

  const nmIdx=nextMyPick(mine?pickN+1:pickN);
  const nextMineForScore = nmIdx!=null ? nmIdx+1 : null;
  const top=scored(available, round, nextMineForScore).slice(0,suggestN());
  const maxScore = top.length ? Math.max(...top.map(t=>t.score),1) : 1;
  const suggCards = top.map((t,i)=>{
    const barW = Math.max(4,(t.score/maxScore)*100).toFixed(0)+'%';
    const accent = i===0?'#00FF9C':i===1?'#4C8DFF':'#8890A2';
    return `<div class="suggcard" style="border-left-color:${accent}" onclick="draft('${t.p.id}')">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="mono" style="font-size:10px;color:#5C6275">#${i+1}</span>
        <span style="font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.p.name)}</span>
        <span class="mono" style="font-size:12px;font-weight:700;color:${accent}">${t.score.toFixed(0)}</span>
      </div>
      <div class="mono" style="font-size:10px;color:#8890A2;margin-top:3px">${esc(t.p[posRankKey()]||t.p.pos)} · ${esc(t.p.team)} · BYE ${t.p.bye||'—'} · OVR ${t.p[rankKey()]}</div>
      <div style="height:4px;background:#212129;border-radius:2px;margin:8px 0 9px;overflow:hidden"><div style="height:100%;border-radius:2px;width:${barW};background:${accent}"></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${t.reasons.slice(0,4).map(rc=>`<span class="pill" style="color:${rc.color}">${esc(rc.text)}</span>`).join('')}</div>
    </div>`;
  }).join('');

  const teamsList=Object.keys(TEAM_COLOR).sort().filter(t=>t!=='FA');
  const sosGrid = teamsList.map(t=>`<label style="display:flex;align-items:center;gap:4px;background:#08080A;border:1px solid #212129;border-radius:6px;padding:4px 5px">
      <span class="mono" style="font-size:9.5px;color:#8890A2;flex:1">${t}</span>
      <input value="${state.sos[t]||''}" onchange="const v=parseInt(this.value,10);const next={...state.sos};if(v>=1&&v<=5)next['${t}']=v;else delete next['${t}'];state.sos=next;save();" style="width:22px;background:#17171D;border:1px solid #2E2E38;border-radius:4px;color:#fff;font-size:10px;text-align:center;padding:2px 0">
    </label>`).join('');

  return `<div class="sidewrap">
    <div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
        ${posBtns}
        <div style="flex:1"></div>
        <input class="searchbox" placeholder="search player" value="${esc(state.q)}" oninput="state.q=this.value;render()">
        <button class="btn" onclick="state.hideDrafted=!state.hideDrafted;save()">${state.hideDrafted?'DRAFTED HIDDEN':'DRAFTED SHOWN'}</button>
        <button class="btn" onclick="state.showSources=!state.showSources;save()">${state.showSources?'MKT ADP: SOURCES':'MKT ADP: SUMMARY'}</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#0F0F13;border:1px solid #212129;border-left:3px solid #2A56B0;border-radius:8px;padding:9px 14px;margin-bottom:10px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:#5C6275">MKT ADP KEY</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;color:#00FF9C;text-shadow:0 0 12px rgba(0,255,156,.5);background:rgba(0,255,156,.14);border:1px solid rgba(0,255,156,.45);border-radius:5px;padding:2px 7px">+10 or better</span><span style="font-size:11px;color:#A9AFC0">you rank him well above the market — good pick, he should still be there</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;color:#FF3355;text-shadow:0 0 12px rgba(255,51,85,.5);background:rgba(255,51,85,.14);border:1px solid rgba(255,51,85,.5);border-radius:5px;padding:2px 7px">−30 or worse</span><span style="font-size:11px;color:#A9AFC0">market has him far above your rank — stay away, they are paying up</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:#FFC93C;background:rgba(255,201,60,.14);border:1px solid rgba(255,201,60,.4);border-radius:5px;padding:2px 7px">−15</span><span style="font-size:11px;color:#A9AFC0">market slightly higher</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#00B36E">◆ +3 to +9</span><span style="font-size:11px;color:#A9AFC0">slight edge</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#FFC93C">⚠ −3 to −9</span><span style="font-size:11px;color:#A9AFC0">slight reach</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8890A2">−2 to +2</span><span style="font-size:11px;color:#5C6275">boards agree</span></span>
        <span style="display:flex;align-items:center;gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;color:#FF5FC8;background:rgba(255,95,200,.16);border:1px solid rgba(255,95,200,.55);border-radius:5px;padding:2px 7px;text-shadow:0 0 12px rgba(255,95,200,.6)">▼ 12</span><span style="font-size:11px;color:#A9AFC0">LIVE: picks he has slid past his market ADP right now — 5+ lights up pink</span></span>
      </div>
      <div class="card">
        <div class="rowhead" style="grid-template-columns:${rowGridCols()}"><div>#</div><div>PLAYER</div><div>POS</div><div style="text-align:center">BYE</div><div style="text-align:right">AUC$</div><div style="text-align:center">SOS</div><div style="text-align:right">${state.showSources?'MKT ADP · SOURCES':'MKT ADP'}</div><div style="text-align:right">LIVE</div><div>STATUS</div></div>
        <div style="max-height:calc(100vh - 300px);overflow-y:auto">${rows || '<div style="padding:20px;color:#5C6275;font-size:12px">No players match.</div>'}</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="sidecard">
        <div class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275;margin-bottom:8px">ON THE CLOCK</div>
        <div style="display:flex;align-items:baseline;gap:10px">
          <div class="mono" style="font-size:26px;font-weight:700;color:${mine?'#00FF9C':'#fff'}">${pickLabelFor(pickN)}</div>
          <div style="font-size:12.5px;font-weight:600;color:${mine?'#00FF9C':'#fff'}">${mine?'YOUR PICK':'TEAM '+onClockTeam}</div>
        </div>
        <div class="mono" style="font-size:10.5px;color:#8890A2;margin-top:6px">${mine?('ROUND '+(round+1)+' · '+(teams()*rounds()-pickN)+' picks left in draft'):(nmIdx!=null?('YOUR NEXT: '+pickLabelFor(nmIdx)+'  ·  '+(nmIdx-pickN)+' picks away'):'NO PICKS REMAINING')}</div>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
          <span style="width:3px;height:16px;background:#4C8DFF;border-radius:2px"></span>
          <span style="font-size:13px;font-weight:700">${mine?'TAKE ONE OF THESE':'BEST AVAILABLE FOR YOU'}</span>
        </div>
        ${suggCards || '<div style="color:#5C6275;font-size:12px">No suggestions available.</div>'}
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #212129;background:#08080A">
          <span class="mono" style="font-size:9px;letter-spacing:.1em;color:#5C6275">MY ROSTER</span>
          <span class="mono" style="font-size:9.5px;color:#8890A2">${roster.length} / ${rounds()}</span>
        </div>
        ${slotRows.join('')}
        <div style="padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#454A5C">${byeLine}</div>
      </div>
      <div class="card">
        <button class="btn" style="width:100%;text-align:left;background:#08080A;border:none;border-bottom:1px solid #212129;padding:11px 14px;border-radius:0" onclick="state.showSos=!state.showSos;save()">${state.showSos?'▾ ':'▸ '}STRENGTH OF SCHEDULE (FILL IN)</button>
        ${state.showSos ? `<div style="padding:12px 14px">
          <div class="mono" style="font-size:10px;color:#5C6275;line-height:1.5;margin-bottom:10px">Type 1 (easiest) to 5 (hardest) per team — feeds the suggestion score and SOS column. Saved locally.</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${sosGrid}</div>
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

function renderQueue(){
  const taken=new Set(state.picks.map(p=>p.id));
  const teamOf={}; state.picks.forEach(k=>{teamOf[k.id]=k.team;});
  const pickN=state.picks.length;
  const rows=state.queue.map((id,i)=>{
    const p=PLAYERS.find(x=>x.id===id);
    if(!p) return '';
    const gone=taken.has(id);
    const byMe = gone && teamOf[p.id]===state.mySlot;
    const a=mkt(p);
    const deltaColor = a ? (a.delta<=-30?'#FF3355':a.delta<=-15?'#FFC93C':a.delta>=10?'#00FF9C':'#8890A2') : '#454A5C';
    const deltaTxt = a ? (a.delta>0?'+'+a.delta:String(a.delta)) : '—';
    const slide = !gone && a ? (pickN+1)-a.avg : null;
    const hot = slide!=null && slide>=5;
    const liveTxt = gone ? '—' : (slide==null?'—':(slide>0?'▼ '+slide:'in '+(-slide)));
    const stateTxt = byMe?'ON MY ROSTER':(gone?'GONE · TEAM '+teamOf[p.id]:statusText(p));
    return `<div class="row" style="grid-template-columns:40px minmax(0,1fr) 44px 40px 76px 76px 150px;opacity:${gone?0.42:1}">
      <div class="mono" style="font-size:11px;color:#5C6275">${i+1}</div>
      <div style="display:flex;align-items:center;gap:9px;min-width:0">
        <span style="width:3px;height:26px;border-radius:2px;background:${TEAM_COLOR[p.team]||'#4C8DFF'}"></span>
        <div style="min-width:0"><div style="font-size:13.5px;font-weight:600">${esc(p.name)}</div><div class="mono" style="font-size:10px;color:#5C6275">${esc(p.team)} · OVR ${p[rankKey()]}</div></div>
      </div>
      <div class="mono" style="font-size:11px;font-weight:700;color:${POS_COLOR[p.pos]||'#A9AFC0'}">${esc(p[posRankKey()]||p.pos)}</div>
      <div class="mono" style="font-size:11.5px;text-align:center">${p.bye||'—'}</div>
      <div class="mono" style="font-size:11px;text-align:right;font-weight:700;color:${deltaColor}">${deltaTxt}</div>
      <div class="mono" style="font-size:10.5px;text-align:right;color:${hot?'#FF5FC8':'#5C6275'}">${liveTxt}</div>
      <div style="display:flex;gap:5px;justify-content:flex-end;align-items:center">
        <span class="mono" style="font-size:9.5px;color:${byMe?'#00FF9C':gone?'#FF3355':'#8890A2'};margin-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px">${stateTxt}</span>
        <button class="btn" style="padding:4px 8px" onclick="moveQueue('${id}',-1)">↑</button>
        <button class="btn" style="padding:4px 8px" onclick="moveQueue('${id}',1)">↓</button>
        <button class="btn" style="padding:4px 8px" onclick="${gone?'':`draft('${id}')`}">${gone?'TAKEN':'DRAFT'}</button>
        <button class="btn" style="padding:4px 8px" onclick="toggleQueue('${id}')">✕</button>
      </div>
    </div>`;
  }).join('');
  const avail = state.queue.filter(id=>!taken.has(id)).length;
  return `<div class="content">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
      <span style="width:3px;height:16px;background:#FFC93C;border-radius:2px"></span>
      <span style="font-size:14px;font-weight:700">MY QUEUE — PLAYERS I AM TARGETING</span>
      <span class="mono" style="font-size:10.5px;color:#8890A2">${state.queue.length?(avail+' still available · '+(state.queue.length-avail)+' gone'):'nothing queued yet'}</span>
    </div>
    <div class="card">
      <div class="rowhead" style="grid-template-columns:40px minmax(0,1fr) 44px 40px 76px 76px 150px"><div>ORD</div><div>PLAYER</div><div>POS</div><div>BYE</div><div style="text-align:right">MKT Δ</div><div style="text-align:right">LIVE</div><div style="text-align:right">ACTIONS</div></div>
      ${rows || '<div style="padding:20px;color:#5C6275;font-size:12px">Star a player on the big board to add them here.</div>'}
    </div>
  </div>`;
}

function renderGrid(){
  const T=teams(), R=rounds();
  const byId=Object.fromEntries(PLAYERS.map(p=>[p.id,p]));
  const pickN=state.picks.length;
  let header=`<div style="background:#08080A;padding:8px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5C6275;text-align:center">RD</div>`;
  for(let t=1;t<=T;t++) header+=`<div style="background:#08080A;padding:8px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;text-align:center;color:${t===state.mySlot?'#00FF9C':'#5C6275'}">${t===state.mySlot?'★ ME':'TM '+t}</div>`;
  let cells='';
  for(let r=0;r<R;r++){
    cells+=`<div style="background:#08080A;padding:6px;min-height:34px"><div class="mono" style="font-size:9px;color:#5C6275">${r+1}</div></div>`;
    for(let team=1;team<=T;team++){
      const n=r*T+(r%2===0?team-1:T-team);
      const k=state.picks.find(x=>x.n===n);
      const p=k?byId[k.id]:null;
      const bg=team===state.mySlot?'#111A16':(n===pickN?'#17171D':'#0F0F13');
      const nameColor=p?(team===state.mySlot?'#00FF9C':'#D8DBE6'):(n===pickN?'#4C8DFF':'#2E2E38');
      cells+=`<div style="background:${bg};padding:6px;min-height:34px">
        <div class="mono" style="font-size:9px;color:${n===pickN?'#4C8DFF':'#454A5C'}">${pickLabelFor(n)}${p?' · '+p.pos:''}</div>
        <div style="font-size:11px;font-weight:600;color:${nameColor};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p?esc(p.name):(n===pickN?'ON THE CLOCK':'—')}</div>
      </div>`;
    }
  }
  return `<div class="content" style="max-width:1560px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
      <span style="width:3px;height:16px;background:#4C8DFF;border-radius:2px"></span>
      <span style="font-size:14px;font-weight:700">DRAFT GRID — ALL ${T} TEAMS</span>
    </div>
    <div class="card" style="overflow:auto">
      <div style="display:grid;grid-template-columns:44px repeat(${T},minmax(96px,1fr));gap:1px;background:#212129;min-width:${44+T*96}px">${header}${cells}</div>
    </div>
    <div class="mono" style="font-size:10px;color:#454A5C;margin-top:10px">Snake order, odd rounds left to right. Your column is highlighted. Every pick made on the board lands here.</div>
  </div>`;
}

function renderInjury(){
  const withInj = PLAYERS.filter(p=>p.injStatus);
  const rows = withInj.map(p=>{
    return `<div style="display:grid;grid-template-columns:minmax(0,1.1fr) 78px 150px 96px minmax(0,1.6fr) 108px;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid #212129">
      <div style="font-size:13px;font-weight:600">${esc(p.name)}</div>
      <div class="mono" style="font-size:10px;font-weight:700;color:${statusColor(p)}">${esc(p.injStatus)}</div>
      <div class="mono" style="font-size:10.5px;color:#A9AFC0">${esc(p.injury||'—')}</div>
      <div class="mono" style="font-size:10.5px;color:#8890A2">${esc(p.injEarliest||'—')}</div>
      <div style="font-size:11.5px;color:${(p.injAction||'').startsWith('DO NOT')?'#FF3355':(p.injAction||'').startsWith('High risk')||(p.injAction||'').startsWith('MAJOR')?'#FF7B4C':'#A9AFC0'}">${esc(p.injAction||'—')}</div>
      <div class="mono" style="font-size:10px;color:#5C6275">${esc(p.injBoard||'—')}</div>
    </div>`;
  }).join('');
  return `<div class="content">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
      <span style="width:3px;height:16px;background:#FF3355;border-radius:2px"></span>
      <span style="font-size:14px;font-weight:700">INJURY WATCH — UPDATED 8/22/2026</span>
      <span class="mono" style="font-size:10px;color:#5C6275">Manual snapshot, not a live feed</span>
    </div>
    <div class="card">
      <div style="display:grid;grid-template-columns:minmax(0,1.1fr) 78px 150px 96px minmax(0,1.6fr) 108px;gap:8px;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;color:#5C6275;border-bottom:1px solid #212129;background:#08080A">
        <div>PLAYER</div><div>STATUS</div><div>INJURY</div><div>EARLIEST</div><div>DRAFT ACTION</div><div>BOARD</div>
      </div>
      ${rows || '<div style="padding:20px;color:#5C6275;font-size:12px">No tracked injuries.</div>'}
    </div>
  </div>`;
}

function render(){
  const v = state.view;
  document.getElementById('app').innerHTML = renderHeader() + (
    v==='board' ? renderBoard() :
    v==='queue' ? renderQueue() :
    v==='grid' ? renderGrid() :
    renderInjury()
  );
}
render();
</script>
</body>
</html>
