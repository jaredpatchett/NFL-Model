document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    <div style=\"background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #212129;background:#08080A\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:#5C6275\">MY ROSTER<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#8890A2\">{{ rosterCount }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ slots }}\" as=\"sl\" hint-placeholder-count=\"10\">\n        <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid #212129\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:{{ sl.slotColor }}\">{{ sl.slot }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:{{ sl.nameColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ sl.name }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-align:right;color:{{ sl.byeColor }}\">{{ sl.bye }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#454A5C\">{{ byeLine }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:hidden\">\n      <button sc-camel-on-click=\"{{ onToggleSos }}\" style=\"width:100%;text-align:left;background:#08080A;border:none;border-bottom:1px solid #212129;color:#A9AFC0;font-size:10px;letter-spacing:.1em;padding:11px 14px;cursor:pointer\">{{ sosHeader }}<\u002Fbutton>\n      <sc-if value=\"{{ showSos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:12px 14px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5C6275;line-height:1.5;margin-bottom:10px\">Not in your file — type 1 (easiest schedule) to 5 (hardest) per team and it feeds the suggestion score. Saved locally.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px\">\n            <sc-for list=\"{{ sosTeams }}\" as=\"st\" hint-placeholder-count=\"32\">\n              <label style=\"display:flex;align-items:center;gap:4px;background:#08080A;border:1px solid #212129;border-radius:6px;padding:4px 5px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#8890A2;flex:1\">{{ st.team }}<\u002Fspan>\n                <input value=\"{{ st.value }}\" sc-camel-on-change=\"{{ st.onChange }}\" style=\"width:22px;background:#17171D;border:1px solid #2E2E38;border-radius:4px;color:#fff;font-size:10px;text-align:center;padding:2px 0\">\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isQueue }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:18px 22px 60px;max-width:1180px;margin:0 auto\">\n  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n    <span style=\"width:3px;height:16px;background:#FFC93C;border-radius:2px;box-shadow:0 0 8px rgba(255,201,60,.6)\"><\u002Fspan>\n    <span style=\"font-size:14px;font-weight:700;letter-spacing:.02em\">MY QUEUE — PLAYERS I AM TARGETING<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8890A2\">{{ queueSummary }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:hidden\">\n    <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 44px 40px 88px 80px 128px 116px;gap:8px;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;color:#5C6275;border-bottom:1px solid #212129;background:#08080A\">\n      <div>ORD<\u002Fdiv><div>PLAYER<\u002Fdiv><div>POS<\u002Fdiv><div style=\"text-align:center\">BYE<\u002Fdiv><div style=\"text-align:right\">MKT ADP<\u002Fdiv><div style=\"text-align:right\">LIVE<\u002Fdiv><div>STATUS<\u002Fdiv><div style=\"text-align:right\">ACTIONS<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ queueRows }}\" as=\"q\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 44px 40px 88px 80px 128px 116px;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid #212129;opacity:{{ q.opacity }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5C6275\">{{ q.ord }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n          <span style=\"width:3px;height:26px;border-radius:2px;flex:0 0 auto;background:{{ q.teamColor }}\"><\u002Fspan>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ q.name }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5C6275;margin-top:1px\">{{ q.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:{{ q.posColor }}\">{{ q.pos }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:center;color:#D8DBE6\">{{ q.bye }}<\u002Fdiv>\n        <div style=\"text-align:right;font-family:'IBM Plex Mono',monospace\">\n          <div style=\"display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;color:{{ q.deltaColor }};background:{{ q.deltaBg }};border:1px solid {{ q.deltaBorder }}\">{{ q.delta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;font-family:'IBM Plex Mono',monospace\">\n          <div style=\"display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;font-weight:{{ q.liveWeight }};color:{{ q.liveColor }};background:{{ q.liveBg }};border:1px solid {{ q.liveBorder }};text-shadow:{{ q.liveGlow }}\">{{ q.live }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ q.stateColor }}\">{{ q.state }}<\u002Fdiv>\n        <div style=\"display:flex;gap:5px;justify-content:flex-end\">\n          <button sc-camel-on-click=\"{{ q.onUp }}\" title=\"Move up\" style=\"width:24px;height:24px;padding:0;border-radius:5px;cursor:pointer;background:#17171D;border:1px solid #2E2E38;color:#A9AFC0;font-size:11px\">↑<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ q.onDown }}\" title=\"Move down\" style=\"width:24px;height:24px;padding:0;border-radius:5px;cursor:pointer;background:#17171D;border:1px solid #2E2E38;color:#A9AFC0;font-size:11px\">↓<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ q.onDraft }}\" title=\"Log this pick\" style=\"height:24px;padding:0 8px;border-radius:5px;cursor:pointer;background:{{ q.draftBg }};border:1px solid {{ q.draftBorder }};color:{{ q.draftColor }};font-size:10px;font-weight:700\">{{ q.draftLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ q.onRemove }}\" title=\"Remove from queue\" style=\"width:24px;height:24px;padding:0;border-radius:5px;cursor:pointer;background:#17171D;border:1px solid #2E2E38;color:#5C6275;font-size:11px\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding:12px 16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#454A5C\">{{ queueFootnote }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isGrid }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:18px 22px 60px;max-width:1520px;margin:0 auto\">\n  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n    <span style=\"width:3px;height:16px;background:#4C8DFF;border-radius:2px;box-shadow:0 0 8px rgba(76,141,255,.7)\"><\u002Fspan>\n    <span style=\"font-size:14px;font-weight:700;letter-spacing:.02em\">DRAFT GRID — ALL 14 TEAMS<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:auto\">\n    <div style=\"display:grid;grid-template-columns:44px repeat(14,minmax(96px,1fr));gap:1px;background:#212129;min-width:1420px\">\n      <div style=\"background:#08080A;padding:8px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5C6275;text-align:center\">RD<\u002Fdiv>\n      <sc-for list=\"{{ gridHeader }}\" as=\"h\" hint-placeholder-count=\"14\">\n        <div style=\"background:#08080A;padding:8px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;text-align:center;letter-spacing:.06em;color:{{ h.color }}\">{{ h.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ gridCells }}\" as=\"c\" hint-placeholder-count=\"60\">\n        <div style=\"background:{{ c.bg }};padding:6px;min-height:34px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:{{ c.metaColor }}\">{{ c.meta }}<\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:600;color:{{ c.nameColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.name }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#454A5C;margin-top:10px\">Snake order, odd rounds left to right. Your column is highlighted. Every pick made on the board lands here.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInj }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:18px 22px 60px;max-width:1180px;margin:0 auto\">\n  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n    <span style=\"width:3px;height:16px;background:#FF3355;border-radius:2px;box-shadow:0 0 8px rgba(255,51,85,.6)\"><\u002Fspan>\n    <span style=\"font-size:14px;font-weight:700;letter-spacing:.02em\">INJURY WATCH — UPDATED 8/21/2026<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#0F0F13;border:1px solid #212129;border-radius:12px;overflow:hidden\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) 78px 120px 96px minmax(0,1.5fr) 108px;gap:8px;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;color:#5C6275;border-bottom:1px solid #212129;background:#08080A\">\n      <div>PLAYER<\u002Fdiv><div>STATUS<\u002Fdiv><div>INJURY<\u002Fdiv><div>EARLIEST<\u002Fdiv><div>DRAFT ACTION<\u002Fdiv><div>BOARD<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ injuryRows }}\" as=\"i\" hint-placeholder-count=\"12\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) 78px 120px 96px minmax(0,1.5fr) 108px;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid #212129\">\n        <div style=\"font-size:13px;font-weight:600\">{{ i.name }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:{{ i.statusColor }}\">{{ i.status }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#A9AFC0\">{{ i.injury }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8890A2\">{{ i.ret }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:{{ i.actionColor }}\">{{ i.action }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5C6275\">{{ i.board }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"max-width:1520px;margin:0 auto;padding:0 22px 40px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5C6275;line-height:1.6\">Rankings, tiers and auction values are preserved verbatim from the 2026 1-QB PPR guide (Top 200 + K/DST boards). Injury status as of 8/21/2026. Suggestion scores are computed locally from tier scarcity, roster need, injury downgrade, rookie prospect score and any SOS you enter — they do not re-rank the guide. MKT ADP is annotation only: your board stays the ranking, the market columns just show where CBS's PPR Top 200 consensus (retrieved 8/21/2026) and the 2026 PPR 300 cheat sheet disagree. 213 of 230 players matched to at least one board; the rest read \"no match\". Draft Sharks' ADP table loads client-side and its linked view is Dynasty Superflex, so it is not included.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;teams&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:8,&quot;max&quot;:16,&quot;section&quot;:&quot;League&quot;},&quot;rounds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:17,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:20,&quot;section&quot;:&quot;League&quot;},&quot;starterSlots&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;QB,RB,RB,WR,WR,TE,FLEX,FLEX,K,DEF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;League&quot;},&quot;suggestionCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:6,&quot;section&quot;:&quot;Board&quot;}}\">\nconst TEAM_COLOR={ARI:'#97233F',ATL:'#A71930',BAL:'#241773',BUF:'#00338D',CAR:'#0085CA',CHI:'#C83803',CIN:'#FB4F14',CLE:'#FF3C00',DAL:'#003594',DEN:'#FB4F14',DET:'#0076B6',GB:'#203731',HOU:'#A71930',IND:'#002C5F',JAX:'#D7A22A',KC:'#E31837',LV:'#A5ACAF',LAC:'#0080C6',LAR:'#003594',MIA:'#008E97',MIN:'#4F2683',NE:'#C60C30',NO:'#D3BC8D',NYG:'#0B2265',NYJ:'#125740',PHI:'#004C54',PIT:'#FFB612',SF:'#AA0000',SEA:'#69BE28',TB:'#D50A0A',TEN:'#4B92DB',WAS:'#FFB612'};\nconst POS_COLOR={QB:'#FFC93C',RB:'#00FF9C',WR:'#4C8DFF',TE:'#FF7BD5',K:'#A9AFC0',DST:'#8890A2'};\nconst KEY='draftroom.v2';\n\nclass Component extends DCLogic {\n  state={picks:[],mySlot:1,view:'board',pos:'ALL',q:'',hideDrafted:true,sos:{},showSos:false,loaded:false,queue:[],cfg:{},showCfg:false};\n\n  componentDidMount(){\n    try{\n      const raw=localStorage.getItem(KEY);\n      if(raw){const s=JSON.parse(raw);this.setState({picks:s.picks||[],mySlot:s.mySlot||1,sos:s.sos||{},queue:s.queue||[],cfg:s.cfg||{},loaded:true});return;}\n    }catch(e){}\n    this.setState({loaded:true});\n  }\n  save(next){\n    const s={...this.state,...next};\n    try{localStorage.setItem(KEY,JSON.stringify({picks:s.picks,mySlot:s.mySlot,sos:s.sos,queue:s.queue,cfg:s.cfg}));}catch(e){}\n    this.setState(next);\n  }\n\n  get cfg(){return this.state.cfg||{};}\n  get teams(){return this.cfg.teams??this.props.teams??14;}\n  get rounds(){return this.cfg.rounds??this.props.rounds??17;}\n  get slotsStr(){return this.cfg.starterSlots??this.props.starterSlots??'QB,RB,RB,WR,WR,TE,FLEX,FLEX,K,DEF';}\n  get suggestN(){return this.cfg.suggestionCount??this.props.suggestionCount??3;}\n  get starters(){return this.slotsStr.split(',').map(s=>s.trim()).filter(Boolean);}\n  get data(){return (typeof window!=='undefined'&&window.BIG_BOARD_DATA)||{players:[],injuryWatch:[]};}\n\n  teamForPick(n){const T=this.teams,r=Math.floor(n/T),i=n%T;return r%2===0?i+1:T-i;}\n  pickLabelFor(n){const T=this.teams;return (Math.floor(n/T)+1)+'.'+String(n%T+1).padStart(2,'0');}\n  nextMyPick(from){for(let n=from;n<this.teams*this.rounds;n++){if(this.teamForPick(n)===this.state.mySlot)return n;}return null;}\n\n  injPenalty(p){\n    const a=(p.action||'');\n    if(a.startsWith('DO NOT DRAFT'))return -70;\n    if(a.startsWith('MAJOR DOWNGRADE'))return -26;\n    if(a.startsWith('High risk'))return -20;\n    if(a.startsWith('Downgrade'))return -11;\n    if(a.startsWith('Monitor closely'))return -7;\n    if(a.startsWith('Monitor'))return -3;\n    return 0;\n  }\n  statusColor(p){\n    const s=p.injStatus||'';\n    if(s==='IR'||s==='Out')return '#FF3355';\n    if(s==='Doubtful')return '#FF7B4C';\n    if(s==='Questionable')return '#FFC93C';\n    return '#454A5C';\n  }\n  statusText(p){\n    if(!p.injStatus||p.injStatus.startsWith('Healthy'))return '—';\n    const bits=[p.injStatus];\n    if(p.injury)bits.push(p.injury);\n    return bits.join(' · ');\n  }\n\n  toggleQueue(id){\n    const q=this.state.queue;\n    this.save({queue:q.includes(id)?q.filter(x=>x!==id):[...q,id]});\n  }\n  moveQueue(id,dir){\n    const q=[...this.state.queue];\n    const i=q.indexOf(id),j=i+dir;\n    if(i<0||j<0||j>=q.length)return;\n    q[i]=q[j];q[j]=id;\n    this.save({queue:q});\n  }\n  liveSlide(p,pickN){\n    const a=this.mkt(p);\n    if(!a)return null;\n    return (pickN+1)-a.avg;\n  }\n  mkt(p){\n    const a=p.adp||{};\n    const v=[a.cbs,a.cs300].filter(x=>typeof x==='number');\n    if(!v.length)return null;\n    const avg=Math.round(v.reduce((x,y)=>x+y,0)/v.length);\n    return {avg,delta:avg-p.rank,detail:[a.cbs?'C'+a.cbs:null,a.cs300?'S'+a.cs300:null].filter(Boolean).join(' ')};\n  }\n  myRoster(){\n    const byId=Object.fromEntries(this.data.players.map(p=>[p.id,p]));\n    return this.state.picks.filter(k=>k.team===this.state.mySlot).map(k=>byId[k.id]).filter(Boolean);\n  }\n  needMap(){\n    const roster=this.myRoster();\n    const filled={};\n    const need={};\n    const counts={};\n    roster.forEach(p=>{counts[p.pos]=(counts[p.pos]||0)+1;});\n    const slots=this.starters;\n    const cap={};\n    slots.forEach(s=>{cap[s]=(cap[s]||0)+1;});\n    ['QB','RB','WR','TE'].forEach(pos=>{\n      const hard=cap[pos]||0;\n      const have=counts[pos]||0;\n      need[pos]=have<hard?1:0;\n    });\n    const flexCap=cap['FLEX']||0;\n    const flexHave=Math.max(0,(counts.RB||0)-(cap.RB||0))+Math.max(0,(counts.WR||0)-(cap.WR||0))+Math.max(0,(counts.TE||0)-(cap.TE||0));\n    need.FLEX=flexHave<flexCap?1:0;\n    need.K=(counts.K||0)<(cap.K||0)?1:0;\n    need.DST=(counts.DST||0)<(cap.DEF||0)?1:0;\n    need.counts=counts;\n    return need;\n  }\n\n  scored(available,round,nextMineOverall){\n    const need=this.needMap();\n    const byTierPos={};\n    available.forEach(p=>{const k=p.pos+'|'+p.tier;byTierPos[k]=(byTierPos[k]||0)+1;});\n    return available.map(p=>{\n      const reasons=[];\n      let score=100*Math.pow(0.9655,Math.max(0,p.rank-1));\n      if(nextMineOverall!=null&&p.rank<=nextMineOverall){\n        const b=Math.min(10,(nextMineOverall-p.rank)*0.35);\n        if(b>=3){score+=b;reasons.push({text:'GONE BY '+this.pickLabelFor(nextMineOverall-1),color:'#4C8DFF'});}\n      }\n      if(need[p.pos]){score+=14;reasons.push({text:'FILLS '+p.pos,color:'#00FF9C'});}\n      else if(need.FLEX&&(p.pos==='RB'||p.pos==='WR'||p.pos==='TE')){score+=7;reasons.push({text:'FLEX',color:'#4C8DFF'});}\n      else if(p.pos!=='K'&&p.pos!=='DST'){score+=2;reasons.push({text:p.pos+' DEPTH',color:'#8890A2'});}\n      const left=byTierPos[p.pos+'|'+p.tier]||0;\n      if(left<=3&&p.pos!=='K'&&p.pos!=='DST'){score+=8;reasons.push({text:'LAST '+left+' IN TIER',color:'#FFC93C'});}\n      if(p.pos==='K'||p.pos==='DST'){\n        if(round<this.rounds-2){score-=45;reasons.push({text:'TOO EARLY',color:'#FF3355'});}\n        else{score+=26;reasons.push({text:'ROSTER FILL',color:'#00FF9C'});}\n      }\n      const ip=this.injPenalty(p);\n      if(ip<0){score+=ip;reasons.push({text:(p.action||'').split('—')[0].trim().toUpperCase(),color:ip<=-20?'#FF3355':'#FFC93C'});}\n      if(p.rookie&&p.prospect){const b=Math.max(0,(p.prospect-85)*0.7);score+=b;if(b>2)reasons.push({text:'ROOKIE '+p.grade+' · '+p.prospect,color:'#FFC93C'});}\n      const s=this.state.sos[p.team];\n      if(s){const b=(3-s)*4;score+=b;reasons.push({text:'SOS '+s,color:b>0?'#00FF9C':b<0?'#FF3355':'#8890A2'});}\n      const a=this.mkt(p);\n      if(a&&a.delta<=-15)reasons.push({text:'MKT '+a.avg+' ('+a.delta+' MARKET HIGHER)',color:a.delta<=-30?'#FF3355':'#FFC93C'});\n      else if(a&&a.delta>=10)reasons.push({text:'MKT '+a.avg+' (+'+a.delta+' WE LIKE HIM MORE)',color:'#00FF9C'});\n      if(a){const sl=(this.state.picks.length+1)-a.avg;if(sl>=5){score+=Math.min(10,sl*0.25);reasons.push({text:'▼ '+sl+' PAST ADP',color:'#FF5FC8'});}}\n      const byes={};this.myRoster().forEach(r=>{if(r.bye)byes[r.bye]=(byes[r.bye]||0)+1;});\n      if(p.bye&&(byes[p.bye]||0)>=3){score-=7;reasons.push({text:'BYE '+p.bye+' STACK',color:'#FF7B4C'});}\n      return {p,score,reasons};\n    }).sort((a,b)=>b.score-a.score);\n  }\n\n  draft(id){\n    const n=this.state.picks.length;\n    if(n>=this.teams*this.rounds)return;\n    this.save({picks:[...this.state.picks,{id,team:this.teamForPick(n),n}]});\n  }\n\n  renderVals(){\n    const D=this.data,st=this.state;\n    const pickN=st.picks.length;\n    const onClockTeam=this.teamForPick(pickN);\n    const mine=onClockTeam===st.mySlot;\n    const round=Math.floor(pickN/this.teams);\n    const takenIds=new Set(st.picks.map(k=>k.id));\n    const teamOf={};st.picks.forEach(k=>{teamOf[k.id]=k.team;});\n    const available=D.players.filter(p=>!takenIds.has(p.id));\n    const q=st.q.trim().toLowerCase();\n\n    const visible=D.players.filter(p=>{\n      if(st.hideDrafted&&takenIds.has(p.id))return false;\n      if(st.pos!=='ALL'&&p.pos!==st.pos)return false;\n      if(q&&!(p.name.toLowerCase().includes(q)||(p.team||'').toLowerCase().includes(q)))return false;\n      return true;\n    });\n\n    const myByes={};this.myRoster().forEach(r=>{if(r.bye)myByes[r.bye]=(myByes[r.bye]||0)+1;});\n\n    const rows=visible.map(p=>{\n      const drafted=takenIds.has(p.id);\n      const s=st.sos[p.team];\n      const a=this.mkt(p);\n      const cur=pickN+1;\n      const slide=a&&!drafted?cur-a.avg:null;\n      return {\n        live:drafted?'—':(slide==null?'—':(slide>0?'▼ '+slide:'in '+(-slide))),\n        liveColor:drafted?'#454A5C':(slide==null?'#454A5C':slide>=5?'#FF5FC8':slide>0?'#A9AFC0':'#5C6275'),\n        liveBg:!drafted&&slide!=null&&slide>=5?'rgba(255,95,200,.1 POS_COLOR[p.pos]||'#A9AFC0',\n        bye:p.bye||'—',byeColor:(myByes[p.bye]||0)>=2?'#FF7B4C':'#D8DBE6',\n        auction:p.auction?'$'+p.auction:'—',\n        sos:s?String(s):'—',sosColor:s?(s<=2?'#00FF9C':s>=4?'#FF3355':'#A9AFC0'):'#454A5C',\n        star:st.queue.includes(p.id)?'★':'☆',\n        starColor:st.queue.includes(p.id)?'#FFC93C':'#454A5C',\n        starBg:st.queue.includes(p.id)?'rgba(255,201,60,.16)':'transparent',\n        starBorder:st.queue.includes(p.id)?'rgba(255,201,60,.5)':'#212129',\n        onStar:(e)=>{e.stopPropagation();this.toggleQueue(p.id);},\n        status:this.statusText(p),statusColor:this.statusColor(p),\n        teamColor:TEAM_COLOR[p.team]||'#4C8DFF',\n        opacity:drafted?'0.34':'1',\n        onClick:drafted?()=>{}:()=>this.draft(p.id)\n      };\n    });\n\n    const nmIdx=this.nextMyPick(mine?pickN+1:pickN);\n    const nextMineForScore=nmIdx!=null?nmIdx+1:null;\n    const top=this.scored(available,round,nextMineForScore).slice(0,this.suggestN);\n    const maxScore=top.length?Math.max(...top.map(t=>t.score),1):1;\n    const suggestions=top.map((t,i)=>({\n      idx:'#'+(i+1),name:t.p.name,\n      sub:t.p.pos+(t.p.posRank?String(t.p.posRank):'')+' · '+t.p.team+' · BYE '+(t.p.bye||'—')+' · OVR '+(t.p.rank<=200?t.p.rank:'—'),\n      score:t.score.toFixed(0),\n      accent:i===0?'#00FF9C':i===1?'#4C8DFF':'#8890A2',\n      barWidth:Math.max(4,(t.score/maxScore)*100).toFixed(0)+'%',\n      reasons:t.reasons.slice(0,4),\n      onClick:()=>this.draft(t.p.id)\n    }));\n\n    const roster=this.myRoster();\n    const pool=[...roster];\n    const slots=[];\n    const take=(test)=>{const i=pool.findIndex(test);return i>=0?pool.splice(i,1)[0]:null;};\n    this.starters.forEach(sl=>{\n      let p=null;\n      if(sl==='FLEX')p=take(x=>x.pos==='RB'||x.pos==='WR'||x.pos==='TE');\n      else if(sl==='DEF')p=take(x=>x.pos==='DST');\n      else p=take(x=>x.pos===sl);\n      slots.push({slot:sl,slotColor:p?'#A9AFC0':'#454A5C',\n        name:p?p.name+' · '+p.team:'—',nameColor:p?'#fff':'#454A5C',\n        bye:p&&p.bye?String(p.bye):'',byeColor:p&&(myByes[p.bye]||0)>=2?'#FF7B4C':'#8890A2'});\n    });\n    pool.forEach((p,i)=>slots.push({slot:'BN'+(i+1),slotColor:'#454A5C',name:p.name+' · '+p.team,nameColor:'#A9AFC0',bye:p.bye?String(p.bye):'',byeColor:'#8890A2'}));\n\n    const byeLine=Object.keys(myByes).length?('BYE LOAD  '+Object.keys(myByes).sort((a,b)=>a-b).map(w=>'W'+w+':'+myByes[w]).join('   ')):'BYE LOAD  —';\n\n    const gridHeader=[];\n    for(let t=1;t<=this.teams;t++)gridHeader.push({label:t===st.mySlot?'★ ME':'TM '+t,color:t===st.mySlot?'#00FF9C':'#5C6275'});\n    const byId=Object.fromEntries(D.players.map(p=>[p.id,p]));\n    const gridCells=[];\n    for(let r=0;r<this.rounds;r++){\n      gridCells.push({bg:'#08080A',meta:'',name:String(r+1),nameColor:'#5C6275',metaColor:'#5C6275'});\n      for(let team=1;team<=this.teams;team++){\n        const n=r*this.teams+(r%2===0?team-1:this.teams-team);\n        const k=st.picks.find(x=>x.n===n);\n        const p=k?byId[k.id]:null;\n        gridCells.push({\n          bg:team===st.mySlot?'#111A16':(n===pickN?'#17171D':'#0F0F13'),\n          meta:this.pickLabelFor(n)+(p?' · '+p.pos:''),\n          metaColor:n===pickN?'#4C8DFF':'#454A5C',\n          name:p?p.name:(n===pickN?'ON THE CLOCK':'—'),\n          nameColor:p?(team===st.mySlot?'#00FF9C':'#D8DBE6'):(n===pickN?'#4C8DFF':'#2E2E38')\n        });\n      }\n    }\n\n    const byIdAll=Object.fromEntries(D.players.map(p=>[p.id,p]));\n    const queueRows=st.queue.map((id,i)=>{\n      const p=byIdAll[id];\n      if(!p)return null;\n      const gone=takenIds.has(p.id);\n      const byMe=gone&&teamOf[p.id]===st.mySlot;\n      const a=this.mkt(p);\n      const slide=gone?null:this.liveSlide(p,pickN);\n      const hot=slide!=null&&slide>=5;\n      return {\n        ord:String(i+1),name:p.name,sub:p.team+' · '+p.tier+' · OVR '+(p.rank<=200?p.rank:'—'),\n        pos:p.pos,posColor:POS_COLOR[p.pos]||'#A9AFC0',bye:p.bye||'—',\n        teamColor:TEAM_COLOR[p.team]||'#4C8DFF',\n        opacity:gone?'0.42':'1',\n        delta:a?(a.delta>0?'+'+a.delta:String(a.delta)):'—',\n        deltaColor:a?(a.delta<=-30?'#FF3355':a.delta<=-15?'#FFC93C':a.delta>=10?'#00FF9C':'#8890A2'):'#454A5C',\n        deltaBg:a?(a.delta<=-30?'rgba(255,51,85,.14)':a.delta<=-15?'rgba(255,201,60,.14)':a.delta>=10?'rgba(0,255,156,.14)':'transparent'):'transparent',\n        deltaBorder:a?(a.delta<=-30?'rgba(255,51,85,.45)':a.delta<=-15?'rgba(255,201,60,.4)':a.delta>=10?'rgba(0,255,156,.4)':'transparent'):'transparent',\n        live:gone?'—':(slide==null?'—':(slide>0?'▼ '+slide:'in '+(-slide))),\n        liveColor:hot?'#FF5FC8':(gone||slide==null?'#454A5C':slide>0?'#A9AFC0':'#5C6275'),\n        liveBg:hot?'rgba(255,95,200,.16)':'transparent',\n        liveBorder:hot?'rgba(255,95,200,.55)':'transparent',\n        liveGlow:hot?'0 0 12px rgba(255,95,200,.6)':'none',\n        liveWeight:hot?'800':'600',\n        state:byMe?'ON MY ROSTER':(gone?'GONE · TEAM '+teamOf[p.id]:this.statusText(p)),\n        stateColor:byMe?'#00FF9C':(gone?'#FF3355':this.statusColor(p)),\n        draftLabel:gone?'TAKEN':'DRAFT',\n        draftBg:gone?'#0F0F13':'rgba(0,255,156,.14)',\n        draftBorder:gone?'#212129':'rgba(0,255,156,.45)',\n        draftColor:gone?'#454A5C':'#00FF9C',\n        onDraft:gone?()=>{}:()=>this.draft(p.id),\n        onUp:()=>this.moveQueue(p.id,-1),\n        onDown:()=>this.moveQueue(p.id,1),\n        onRemove:()=>this.toggleQueue(p.id)\n      };\n    }).filter(Boolean);\n    const qAvail=queueRows.filter(q=>q.draftLabel==='DRAFT').length;\n\n    const injuryRows=(D.injuryWatch||[]).map(i=>({\n      name:i.name,status:i.status||'—',\n      statusColor:i.status==='IR'||i.status==='Out'?'#FF3355':i.status==='Doubtful'?'#FF7B4C':'#FFC93C',\n      injury:i.injury||'—',ret:i.ret||'—',action:i.action||'—',\n      actionColor:(i.action||'').startsWith('DO NOT')?'#FF3355':(i.action||'').startsWith('High risk')||(i.action||'').startsWith('MAJOR')?'#FF7B4C':'#A9AFC0',\n      board:i.onBoard==='Yes'?(i.boardRank||'on board'):'off board'\n    }));\n\n    const teamsList=Object.keys(TEAM_COLOR).sort();\n    const sosTeams=teamsList.map(t=>({team:t,value:st.sos[t]?String(st.sos[t]):'',\n      onChange:(e)=>{const v=parseInt(e.target.value,10);const next={...st.sos};if(v>=1&&v<=5)next[t]=v;else delete next[t];this.save({sos:next});}}));\n\n    const mk=(key,label)=>({label,bg:st.pos===key?'rgba(62,123,250,.12)':'#0F0F13',fg:st.pos===key?'#4C8DFF':'#A9AFC0',bc:st.pos===key?'#4C8DFF':'#212129',onClick:()=>this.setState({pos:key})});\n    const nextMine=this.nextMyPick(pickN);\n\n    return {\n      isBoard:st.view==='board',isGrid:st.view==='grid',isInj:st.view==='inj',isQueue:st.view==='queue',\n      queueRows,\n      queueSummary:queueRows.length?(qAvail+' still available · '+(queueRows.length-qAvail)+' gone'):'nothing queued yet',\n      queueFootnote:queueRows.length?'Star a player on the big board to queue him. Order is yours — arrows move him up or down. LIVE and MKT ADP update with every pick.':'Click the ☆ next to any player on the big board to add him here.',\n      tabs:[['board','Big Board'],['queue','Queue ('+queueRows.length+')'],['grid','Draft Grid'],['inj','Injury Watch']].map(([v,label])=>({label,\n        bg:st.view===v?'#17171D':'transparent',fg:st.view===v?'#fff':'#5C6275',onClick:()=>this.setState({view:v})})),\n      mySlot:String(st.mySlot),\n      slotOptions:Array.from({length:this.teams},(_,i)=>({v:String(i+1),label:'#'+(i+1)})),\n      onSlotChange:(e)=>this.save({mySlot:parseInt(e.target.value,10)}),\n      clockLabel:'PICK '+this.pickLabelFor(pickN)+' · '+(mine?'YOU':'TEAM '+onClockTeam),\n      clockColor:mine?'#00FF9C':'#fff',\n      pickLabel:this.pickLabelFor(pickN),\n      onClockTeam:mine?'YOUR PICK':'TEAM '+onClockTeam,\n      nextPickLine:mine?('ROUND '+(round+1)+' · '+(this.teams*this.rounds-pickN)+' picks left in draft')\n        :(nextMine!=null?('YOUR NEXT: '+this.pickLabelFor(nextMine)+'  ·  '+(nextMine-pickN)+' picks away'):'NO PICKS REMAINING'),\n      suggestTitle:mine?'TAKE ONE OF THESE':'BEST AVAILABLE FOR YOU',\n      suggestions,rows,slots,byeLine,gridHeader,gridCells,injuryRows,sosTeams,\n      rosterCount:roster.length+' / '+this.rounds,\n      posFilters:[mk('ALL','ALL'),mk('QB','QB'),mk('RB','RB'),mk('WR','WR'),mk('TE','TE'),mk('K','K'),mk('DST','DST')],\n      draftedBtn:{label:st.hideDrafted?'DRAFTED HIDDEN':'DRAFTED SHOWN',\n        bg:st.hideDrafted?'#0F0F13':'rgba(62,123,250,.12)',fg:st.hideDrafted?'#A9AFC0':'#4C8DFF',bc:st.hideDrafted?'#212129':'#4C8DFF',\n        },\n      onToggleDrafted:()=>this.setState({hideDrafted:!st.hideDrafted}),\n      onSearch:(e)=>this.setState({q:e.target.value}),\n      onUndo:()=>this.save({picks:st.picks.slice(0,-1)}),\n      onReset:()=>this.save({picks:[]}),\n      showCfg:st.showCfg,\n      cfgHeader:(st.showCfg?'▾ ':'⚙ ')+'LEAGUE',\n      onToggleCfg:()=>this.setState({showCfg:!st.showCfg}),\n      cfgTeams:String(this.teams),cfgRounds:String(this.rounds),cfgSlots:this.slotsStr,cfgSuggest:String(this.suggestN),\n      onCfgTeams:(e)=>{const v=parseInt(e.target.value,10);if(v>=4&&v<=20)this.save({cfg:{...this.cfg,teams:v}});},\n      onCfgRounds:(e)=>{const v=parseInt(e.target.value,10);if(v>=1&&v<=30)this.save({cfg:{...this.cfg,rounds:v}});},\n      onCfgSlots:(e)=>this.save({cfg:{...this.cfg,starterSlots:e.target.value}}),\n      onCfgSuggest:(e)=>{const v=parseInt(e.target.value,10);if(v>=1&&v<=8)this.save({cfg:{...this.cfg,suggestionCount:v}});},\n      cfgWarn:st.picks.length>this.teams*this.rounds?('⚠ '+(st.picks.length-this.teams*this.rounds)+' logged picks now fall outside the grid'):'',\n      showSos:st.showSos,\n      sosHeader:(st.showSos?'▾ ':'▸ ')+'STRENGTH OF SCHEDULE (FILL IN)',\n      onToggleSos:()=>this.setState({showSos:!st.showSos}),\n      boardFootnote:rows.length+' shown · '+available.length+' of '+D.players.length+' still available ·
