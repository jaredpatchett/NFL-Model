# Runs on a schedule during the season, plus lets you trigger it manually.
# Generates BOTH tracks in one run: spread/total/moneyline (Track B) and
# anytime-TD player probabilities (Track A). Mirrors the wc-7-dashboard cron
# pattern, but as its own independent workflow in its own repo -- see
# README's "fully independent project" note.
#
# Cadence: Tue/Wed/Thu/Fri at 13:00 UTC. Lines move most in the days after a
# week's games post and settle by kickoff, so a few updates a week during
# that window is enough -- there's no live in-game element to either model.
# Adjust the cron below if you want tighter coverage close to kickoff.
on:
  schedule:
    - cron: "0 13 * * 2,3,4,5"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          # nfl_data_py 0.3.3 hard-pins pandas<2.0,numpy<2.0 (no prebuilt
          # wheel for Python 3.12 -- forces a broken source build). Its
          # actual code only needs numpy/pandas/appdirs at import time, and
          # works fine on modern versions (verified against a clean venv
          # matching this runner) -- so install it with --no-deps and supply
          # modern versions of everything it actually needs ourselves.
          pip install --no-deps nfl_data_py
          pip install pandas numpy pyarrow scikit-learn scipy requests appdirs

      - name: Generate spread/total/moneyline predictions (Track B)
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python generate_predictions.py

      - name: Generate anytime-TD predictions (Track A)
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python generate_player_predictions.py

      - name: Backtest against real completed games
        working-directory: scripts
        # Runs after both prediction steps so this run's fresh entries are
        # already in the logs -- though the backtest itself only ever grades
        # against ALREADY-LOGGED pre-game snapshots from past runs, never
        # something generated in this same run, so ordering here doesn't
        # affect correctness either way, just keeps the pipeline reading
        # top-to-bottom in a sensible order. Writes data/backtest_results.json
        # + .js (same overwritten-snapshot pattern as the other two data
        # files) -- expect ~0 results for a while; that's correct, not
        # broken, until real games start finishing (see backtest.py's
        # module docstring).
        run: python backtest.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_lines.json data/nfl_lines.js data/predictions_log.jsonl
          git add data/player_td.json data/player_td.js data/player_td_log.jsonl
          git add data/backtest_results.json data/backtest_results.js
          if git diff --cached --quiet; then
            echo "No changes to predictions -- nothing to commit."
          else
            git commit -m "Auto-update NFL predictions (lines + TD props + backtest) [skip ci]"
            git push
          fi
